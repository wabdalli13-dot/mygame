<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Профессиональные роли — диагностика</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; width: 90%; }
  h1 { text-align: center; color: #2c3e50; }
  .question { font-size: 18px; margin-bottom: 20px; color: #34495e; }
  .option { display: block; width: 100%; padding: 12px; margin: 8px 0; background: #ecf0f1; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: left; transition: background 0.2s; }
  .option:hover { background: #d5dbdb; }
  .progress { text-align: center; color: #7f8c8d; margin-bottom: 15px; }
  .result { margin-top: 20px; }
  .role { margin: 10px 0; padding: 10px; background: #e8f6f3; border-left: 5px solid #1abc9c; border-radius: 5px; }
  .role h3 { margin: 0 0 5px 0; color: #16a085; }
  .role p { margin: 5px 0; color: #2c3e50; }
  .restart { margin-top: 20px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .restart:hover { background: #2980b9; }
</style>
</head>
<body>
<div class="container" id="app">
  <h1>Профессиональные роли</h1>
  <div id="content"></div>
</div>

<script>
const roles = {
  "Предприниматель": { desc: "Инициативный, готов рисковать, ищет новые возможности.", prof: "Бизнесмен, стартап-основатель, продюсер, торговый представитель." },
  "Коммуникатор": { desc: "Общительный, умеет слушать и договариваться, работает с людьми.", prof: "HR-менеджер, психолог, учитель, журналист, продавец." },
  "Инноватор": { desc: "Креативный, генерирует идеи, нестандартно мыслит.", prof: "Дизайнер, маркетолог, разработчик новых продуктов, режиссёр." },
  "Специалист": { desc: "Эксперт в узкой области, глубокие профессиональные знания.", prof: "Врач, инженер, программист, учёный, юрист." },
  "Функционалист": { desc: "Исполнительный, надёжный, чётко выполняет инструкции.", prof: "Бухгалтер, делопроизводитель, оператор, контролёр." },
  "Аналитик": { desc: "Логичный, любит данные, систематизирует информацию.", prof: "Аналитик данных, экономист, аудитор, исследователь." },
  "Администратор": { desc: "Организует процессы, планирует, контролирует.", prof: "Офис-менеджер, администратор проектов, логист, завуч." },
  "Менеджер": { desc: "Управляет командой, мотивирует, координирует.", prof: "Руководитель отдела, проект-менеджер, тимлид, директор." }
};

const questions = [
  { text: "Тебе поручили организовать школьное мероприятие. Твои действия?", options: [
    { text: "Составлю чёткий план: кто, что, когда делает, и буду контролировать каждый этап.", role: "Администратор" },
    { text: "Соберу команду, распределю задачи и буду мотивировать всех работать слаженно.", role: "Менеджер" },
    { text: "Придумаю необычную концепцию, чтобы мероприятие запомнилось.", role: "Инноватор" },
    { text: "Сначала поговорю с одноклассниками, узнаю, что им интересно, и вовлеку их в обсуждение.", role: "Коммуникатор" }
  ]},
  { text: "Нужно придумать новый продукт для школьной ярмарки. С чего начнёшь?", options: [
    { text: "Предложу несколько креативных идей и выберу самую необычную.", role: "Инноватор" },
    { text: "Изучу спрос, посчитаю затраты и проанализирую, что выгоднее.", role: "Аналитик" },
    { text: "Попробую быстро запустить пробную версию и посмотрю, пойдёт ли.", role: "Предприниматель" },
    { text: "Глубоко разберусь в теме и сделаю качественный продукт по всем правилам.", role: "Специалист" }
  ]},
  { text: "В команде произошёл конфликт. Что будешь делать?", options: [
    { text: "Поговорю с каждым, выслушаю и помогу найти общий язык.", role: "Коммуникатор" },
    { text: "Соберу всех и вместе найдём решение, распределю роли.", role: "Менеджер" },
    { text: "Установлю чёткие правила и прослежу, чтобы все их соблюдали.", role: "Администратор" },
    { text: "Предложу действовать по инструкции и не отвлекаться от задачи.", role: "Функционалист" }
  ]},
  { text: "Нужно улучшить работу школьного сайта. Твой подход?", options: [
    { text: "Проанализирую статистику, найду слабые места и предложу оптимизацию.", role: "Аналитик" },
    { text: "Буду чётко выполнять техническое задание и следовать регламенту.", role: "Функционалист" },
    { text: "Предложу новую структуру и удобную навигацию.", role: "Администратор" },
    { text: "Придумаю, как сделать сайт более современным и непохожим на другие.", role: "Инноватор" }
  ]},
  { text: "Нужно найти новых участников для школьного клуба. Как будешь действовать?", options: [
    { text: "Придумаю яркую акцию и попробую новые каналы привлечения.", role: "Предприниматель" },
    { text: "Поговорю с друзьями, расскажу о клубе, приглашу лично.", role: "Коммуникатор" },
    { text: "Организую встречу, назначу ответственных и проконтролирую результат.", role: "Менеджер" },
    { text: "Соберу данные, кто может быть заинтересован, и составлю план.", role: "Аналитик" }
  ]},
  { text: "Тебе нужно обучить новичка. Твои действия?", options: [
    { text: "Подробно объясню тему, покажу профессиональные приёмы.", role: "Специалист" },
    { text: "Дам чёткие инструкции и буду проверять каждый шаг.", role: "Функционалист" },
    { text: "Сначала познакомлюсь, узнаю, что ему интересно, и найду подход.", role: "Коммуникатор" },
    { text: "Составлю план обучения, распределю время и буду поддерживать.", role: "Менеджер" }
  ]},
  { text: "В школе случился кризис (сорвалось мероприятие). Что сделаешь?", options: [
    { text: "Возьму управление на себя, успокою команду и распределю задачи.", role: "Менеджер" },
    { text: "Быстро найду альтернативное решение и рискну попробовать новое.", role: "Предприниматель" },
    { text: "Проанализирую причины, соберу факты и предложу системное решение.", role: "Аналитик" },
    { text: "Организую чёткий порядок действий и проконтролирую выполнение.", role: "Администратор" }
  ]},
  { text: "Тебе предложили внедрить новую технологию в учёбу. Твой шаг?", options: [
    { text: "Предложу своё видение, как сделать это нестандартно и интересно.", role: "Инноватор" },
    { text: "Изучу технологию глубоко, чтобы применять её профессионально.", role: "Специалист" },
    { text: "Оценю, можно ли на этом заработать или получить выгоду.", role: "Предприниматель" },
    { text: "Буду следовать инструкции по внедрению и чётко выполнять требования.", role: "Функционалист" }
  ]}
];

let current = 0;
let scores = {};
Object.keys(roles).forEach(r => scores[r] = 0);

function render() {
  const content = document.getElementById('content');
  if (current < questions.length) {
    const q = questions[current];
    let html = `<div class="progress">Вопрос ${current + 1} из ${questions.length}</div>`;
    html += `<div class="question">${q.text}</div>`;
    q.options.forEach((opt, i) => {
      html += `<button class="option" onclick="choose(${i})">${opt.text}</button>`;
    });
    content.innerHTML = html;
  } else {
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const top = sorted.slice(0, 3);
    let html = `<h1>Твои доминирующие роли</h1>`;
    top.forEach(([role, score]) => {
      html += `<div class="role"><h3>${role} (${score} балл(ов))</h3><p>${roles[role].desc}</p><p><strong>Примеры профессий:</strong> ${roles[role].prof}</p></div>`;
    });
    html += `<button class="restart" onclick="restart()">Пройти заново</button>`;
    content.innerHTML = html;
  }
}

function choose(index) {
  const q = questions[current];
  const role = q.options[index].role;
  scores[role]++;
  current++;
  render();
}

function restart() {
  current = 0;
  Object.keys(scores).forEach(r => scores[r] = 0);
  render();
}

render();
</script>
</body>
</html>
